name: quik_expense_mobile
description: "QuikExpense — Flutter mobile app (iOS + Android)."
publish_to: 'none'

version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.0

  # Routing
  go_router: ^14.8.1

  # App-local utilities not owned by a shared package
  fl_chart: ^0.69.2
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.3

  # Workspace packages
  core:
    path: ../../packages/core
  networking:
    path: ../../packages/networking
  ui_kit:
    path: ../../packages/ui_kit
  localization:
    path: ../../packages/localization
  database:
    path: ../../packages/database
  auth:
    path: ../../packages/features/auth
  expenses:
    path: ../../packages/features/expenses
  categories:
    path: ../../packages/features/categories
  profile:
    path: ../../packages/features/profile
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift: ^2.29.0

flutter:
  uses-material-design: true
