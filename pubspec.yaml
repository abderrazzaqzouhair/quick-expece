name: quik_expense_workspace
publish_to: 'none'

environment:
  sdk: ^3.9.2

# Root workspace manifest. This package has no source of its own — it exists
# so Melos/pub can resolve the workspace and so `dart pub get` at the repo
# root works via pub workspaces.
workspace:
  - apps/quik_expense_mobile
  - packages/core
  - packages/database
  - packages/networking
  - packages/localization
  - packages/ui_kit
  - packages/features/auth
  - packages/features/expenses
  - packages/features/categories
  - packages/features/profile

dev_dependencies:
  melos: ^7.4.0

melos:
  name: quik_expense
  packages:
    - apps/*
    - packages/*
    - packages/features/*

  command:
    version:
      workspaceChangelog: true
    bootstrap:
      usePubspecOverrides: true

  scripts:
    analyze:
      run: dart analyze --fatal-infos
      exec:
        concurrency: 5
      description: Run analyzer on every package.

    format:
      run: dart format --set-exit-if-changed .
      exec:
        concurrency: 5
      description: Check formatting on every package.

    format:fix:
      run: dart format .
      exec:
        concurrency: 5
      description: Fix formatting on every package.

    test:
      run: flutter test
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test
      description: Run tests for every package that has a test/ directory.

    test:coverage:
      run: flutter test --coverage
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test
      description: Run tests with coverage for every package that has a test/ directory.

    build:runner:
      run: dart run build_runner build --delete-conflicting-outputs
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: build_runner
      description: Run code generation for every package depending on build_runner.

    build:runner:watch:
      run: dart run build_runner watch --delete-conflicting-outputs
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: build_runner
      description: Watch + run code generation for every package depending on build_runner.
