name: ui_kit
description: Design system (atoms/molecules/organisms, theme, assets, fonts) shared by every quik_expense app.
version: 0.0.1
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  # Bundled brand fonts go in fonts/ — none yet, typography currently runs
  # entirely on google_fonts. Add an entry here when a custom font is added:
  # fonts:
  #   - family: Brand
  #     fonts:
  #       - asset: fonts/Brand-Regular.ttf
